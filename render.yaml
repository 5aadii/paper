# Render Blueprint for the Python engine (Render → New → Blueprint → pick this repo).
# Secrets are marked sync: false, so Render asks for them when the Blueprint is created.
services:
  - type: web
    name: morning-edition-engine
    runtime: python
    rootDir: engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: SERVICE_SHARED_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
